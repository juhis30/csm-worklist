<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}CSM Worklist{% endblock %}</title>
<style>
  :root { --ink:#1d2433; --muted:#667085; --line:#e4e7ec; --bg:#f7f8fa; --card:#fff; --accent:#2f5bea;
          --up:#c4320a; --down:#067647; --warn-bg:#fffaeb; --warn-line:#fedf89; --info-bg:#eff4ff; --info-line:#c7d7fe;
          --gray:#475467; --gray-bg:#f2f4f7; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--ink); background:var(--bg); }
  a { color:var(--accent); text-decoration:none; } a:hover { text-decoration:underline; }
  header { background:var(--card); border-bottom:1px solid var(--line); padding:0 24px; display:flex; gap:24px; align-items:center; min-height:52px; flex-wrap:wrap; }
  header .brand { font-weight:700; }
  header nav { display:flex; gap:16px; flex:1; flex-wrap:wrap; }
  header .who { color:var(--muted); font-size:13px; }
  main { max-width:1200px; margin:0 auto; padding:24px 16px; }
  h1 { font-size:22px; margin:0 0 4px; } h2 { font-size:16px; margin:28px 0 10px; } h3 { font-size:14px; margin:16px 0 6px; }
  .sub { color:var(--muted); margin-bottom:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:16px; margin-bottom:12px; }
  .scroll { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; background:var(--card); }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-size:12px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.03em; }
  .num { text-align:right; font-variant-numeric:tabular-nums; }
  .badge { display:inline-block; padding:1px 8px; border-radius:10px; font-size:12px; font-weight:600; color:var(--gray); background:var(--gray-bg); }
  .banner { padding:10px 14px; border-radius:8px; margin-bottom:12px; border:1px solid; }
  .banner.warn { background:var(--warn-bg); border-color:var(--warn-line); } .banner.info { background:var(--info-bg); border-color:var(--info-line); }
  .muted { color:var(--muted); } .small { font-size:12px; }
  .up { color:var(--up); } .down { color:var(--down); }
  ul.reasons { margin:0; padding-left:16px; }
  .stats { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:8px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:10px 14px; min-width:150px; flex:1; text-align:left; font:inherit; }
  .stat .v { font-size:20px; font-weight:700; }
  button { font:inherit; padding:6px 12px; border-radius:6px; border:1px solid var(--line); background:var(--card); cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  input, select, textarea { font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:6px; max-width:100%; }
  textarea { width:100%; }
  pre { background:var(--gray-bg); padding:8px; border-radius:6px; font-size:12px; white-space:pre-wrap; word-break:break-all; margin:0; }
  details summary { cursor:pointer; }
  .bar { height:8px; background:var(--gray-bg); border-radius:4px; position:relative; min-width:120px; }
  .bar span { position:absolute; top:0; bottom:0; border-radius:4px; }
</style>
</head>
<body>
{% if user %}
<header>
  <span class="brand">CSM Worklist</span>
  <nav>
    <a href="/">My week</a>
    <a href="/accounts">Accounts</a>
    <a href="/runs">Agent runs</a>
    <a href="/model">Model</a>
    <a href="/data">Data health</a>
  </nav>
  <span class="who">{{ user.name }} · {{ user.org_name }} · <a href="/logout">switch user</a></span>
</header>
{% endif %}
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
